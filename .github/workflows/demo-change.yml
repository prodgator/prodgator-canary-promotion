name: demo-change

# Opens one small change PR into dev and turns on auto-merge, like a user would.
# Runs at 14:23 UTC, Monday to Friday, and on demand (Actions > demo-change > Run workflow).
on:
  schedule:
    - cron: '23 14 * * 1-5'
  workflow_dispatch:
    inputs:
      note:
        description: Short note for the change (optional)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: demo-change
  cancel-in-progress: false

jobs:
  change:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check credentials
        id: creds
        env:
          APP_CLIENT_ID: ${{ vars.CANARY_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CANARY_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Demo automation off::Set the CANARY_APP_CLIENT_ID variable and the CANARY_APP_PRIVATE_KEY secret to turn on the demo automation. Nothing to do."
          fi

      - name: Create App token
        if: steps.creds.outputs.enabled == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CANARY_APP_CLIENT_ID }}
          private-key: ${{ secrets.CANARY_APP_PRIVATE_KEY }}

      - name: Look for an open automated change
        if: steps.creds.outputs.enabled == 'true'
        id: open
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          number=$(gh pr list --base dev --state open --limit 100 --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("feat/auto-"))][0].number // empty')
          if [ -n "$number" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::An automated change is already open (#${number}). Nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.enabled == 'true' && steps.open.outputs.exists == 'false'
        with:
          ref: dev
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.enabled == 'true' && steps.open.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.creds.outputs.enabled == 'true' && steps.open.outputs.exists == 'false'
        run: npm ci

      - name: Make the change
        if: steps.creds.outputs.enabled == 'true' && steps.open.outputs.exists == 'false'
        id: change
        env:
          NOTE: ${{ inputs.note || (github.event_name == 'schedule' && 'Scheduled demo change' || 'Manual demo change') }}
        run: |
          node scripts/demo-change.mjs
          node --input-type=module -e "
            import { appendFileSync } from 'node:fs';
            import { lastChange } from './src/greeting.js';
            appendFileSync(process.env.GITHUB_OUTPUT, 'date=' + lastChange.date + '\n' + 'note=' + lastChange.note + '\n');
          "

      - name: Test the change
        if: steps.creds.outputs.enabled == 'true' && steps.open.outputs.exists == 'false'
        run: npx c8 --reporter=json-summary node --test --test-reporter=junit --test-reporter-destination=junit.xml

      - name: Push the branch
        if: steps.creds.outputs.enabled == 'true' && steps.open.outputs.exists == 'false'
        id: push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          CHANGE_DATE: ${{ steps.change.outputs.date }}
          RUN_ID: ${{ github.run_id }}
        run: |
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          branch="feat/auto-${CHANGE_DATE//-/}-${RUN_ID}"
          git checkout -b "$branch"
          git add src/greeting.js test/last-change.test.js
          git commit -m "feat: demo change ${CHANGE_DATE}"
          git push origin "$branch"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.creds.outputs.enabled == 'true' && steps.open.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.push.outputs.branch }}
          CHANGE_DATE: ${{ steps.change.outputs.date }}
          CHANGE_NOTE: ${{ steps.change.outputs.note }}
        run: |
          body="Change note: ${CHANGE_NOTE}

          Opened by the demo-change workflow. Auto-merge is on, so it merges once the required checks pass."
          url=$(gh pr create --base dev --head "$BRANCH" --title "feat: demo change ${CHANGE_DATE}" --body "$body")
          echo "Opened ${url}"
          if ! gh pr merge "$url" --auto --squash; then
            echo "::warning::Could not turn on auto-merge. Check that Allow auto-merge is on in the repository settings. The pull request stays open."
          fi
